                <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R"

    <!-- Three.js Shader Background Logic -->
    <script>
        // Init Icons
        lucide.createIcons();

        // Navbar Scroll Logic
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            // Only float if body is scrollable (mobile), otherwise always float or fixed
            if (window.scrollY > 20) navbar.classList.add('is-floating');
            else navbar.classList.remove('is-floating');
        });

        // Initialize Shader (Inline for simplicity or load via module)
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const material = new THREE.ShaderMaterial({
                uniforms: { iTime: { value: 0 }, iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } },
                vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform float iTime;
                    uniform vec2 iResolution;

                    #define NUM_OCTAVES 3

                    float rand(vec2 n) {
                        return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
                    }

                    float noise(vec2 p) {
                        vec2 ip = floor(p);
                        vec2 u = fract(p);
                        u = u*u*(3.0-2.0*u);

                        float res = mix(
                            mix(rand(ip), rand(ip + vec2(1.0, 0.0)), u.x),
                            mix(rand(ip + vec2(0.0, 1.0)), rand(ip + vec2(1.0, 1.0)), u.x), u.y);
                        return res * res;
                    }

                    float fbm(vec2 x) {
                        float v = 0.0;
                        float a = 0.3;
                        vec2 shift = vec2(100);
                        mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
                        for (int i = 0; i < NUM_OCTAVES; ++i) {
                            v += a * noise(x);
                            x = rot * x * 2.0 + shift;
                            a *= 0.4;
                        }
                        return v;
                    }

                    void main() {
                        vec2 shake = vec2(sin(iTime * 1.2) * 0.005, cos(iTime * 2.1) * 0.005);
                        vec2 p = ((gl_FragCoord.xy + shake * iResolution.xy) - iResolution.xy * 0.5) / iResolution.y * mat2(6.0, -4.0, 4.0, 6.0);
                        vec2 v;
                        vec4 o = vec4(0.0);

                        float f = 2.0 + fbm(p + vec2(iTime * 5.0, 0.0)) * 0.5;

                        for (float i = 0.0; i < 35.0; i++) {
                            v = p + cos(i * i + (iTime + p.x * 0.08) * 0.025 + i * vec2(13.0, 11.0)) * 3.5 + vec2(sin(iTime * 3.0 + i) * 0.003, cos(iTime * 3.5 - i) * 0.003);
                            float tailNoise = fbm(v + vec2(iTime * 0.5, i)) * 0.3 * (1.0 - (i / 35.0));
                            vec4 auroraColors = vec4(
                                0.1 + 0.3 * sin(i * 0.2 + iTime * 0.4),
                                0.3 + 0.5 * cos(i * 0.3 + iTime * 0.5),
                                0.7 + 0.3 * sin(i * 0.4 + iTime * 0.3),
                                1.0
                            );
                            vec4 currentContribution = auroraColors * exp(sin(i * i + iTime * 0.8)) / length(max(v, vec2(v.x * f * 0.015, v.y * 1.5)));
                            float thinnessFactor = smoothstep(0.0, 1.0, i / 35.0) * 0.6;
                            o += currentContribution * (1.0 + tailNoise * 0.8) * thinnessFactor;
                        }

                        o = tanh(pow(o / 100.0, vec4(1.6)));
                        gl_FragColor = o * 1.5;
                    }
                `
            });
            scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

            function animate() {
                material.uniforms.iTime.value += 0.01;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
            });
        };
    </script>

    <!-- Load Main Logic -->
    <script type="module" src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Force-clear old service worker caches on version mismatch
            const APP_VERSION = 'v3';
            if (localStorage.getItem('app_version') !== APP_VERSION) {
                caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        Promise.all(regs.map(r => r.unregister())).then(() => {
                            localStorage.setItem('app_version', APP_VERSION);
                            window.location.reload();
                        });
                    });
                });
            } else {
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) { refreshing = true; window.location.reload(); }
                });
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
        }
    </script>
