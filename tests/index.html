<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tests - Markdown Renderer</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #fff; padding: 20px; }
        .pass { color: #4caf50; }
        .fail { color: #f44336; }
        h1 { border-bottom: 1px solid #333; }
        .summary { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Unit Test Suite</h1>
    <div id="results">Running tests...</div>

    <script type="module">
        import { runTests } from './suite.js';
        runTests();
    </script>
</body>
</html>
