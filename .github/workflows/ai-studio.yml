name: AI Studio validation

on:
  pull_request:
    paths:
      - 'ai-studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-studio.yml'
  push:
    branches: ['ai-coding-studio-*']
    paths:
      - 'ai-studio/**'
      - 'package.json'
      - '.github/workflows/ai-studio.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run studio:test
      - run: npm run studio:benchmark
      - run: find ai-studio -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npx playwright install --with-deps chromium
      - run: npm run studio:test:e2e
