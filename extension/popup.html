<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 340px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 18px;
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-extract {
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: white;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
        }
        .btn-extract:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-extract:active { transform: translateY(0); }
        .btn-extract:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            display: none;
        }
        .status.show { display: block; }
        .status.success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .status.info {
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .hint {
            margin-top: 14px;
            font-size: 11px;
            color: #475569;
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size: 22px;">📋</span>
        <h1>ChatGPT Extractor</h1>
    </div>
    <p class="subtitle">Extract all AI responses as Markdown with math</p>

    <button id="btn-extract" class="btn btn-extract">
        🚀 Extract &amp; Render
    </button>

    <div id="status" class="status"></div>
    <p class="hint">Open a ChatGPT conversation, then click Extract.<br>It will auto-open RenderX and paste everything.</p>

    <script src="popup.js"></script>
</body>
</html>
